name: Validar contenido

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Pruebas de los scripts
        run: npm test

      - name: Estructura de historias
        run: npm run check:structure

      - name: Tiempo de lectura
        run: npm run reading-time -- --check
